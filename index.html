<!DOCTYPE html>
<html>
<head>
  <title>CampusConnect</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <h3>CampusConnect</h3>

    <a href="index.html"><i class="bi bi-house"></i> Home</a>
    <a href="profile.html"><i class="bi bi-person"></i> Profile</a>
    <a href="messages.html"><i class="bi bi-chat"></i> Messages</a>
  </div>

  <!-- Main -->
  <div class="main">

    <div class="topbar">
      <h4>Home Feed</h4>
    </div>

    <!-- Post box -->
    <div class="post-box">
      <textarea id="postInput" placeholder="What's on your mind?"></textarea>
      <button onclick="addPost()">Post</button>
    </div>

    <!-- Feed -->
    <div id="feed"></div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
